name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
  draft:
    name: Assemble draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gpt-manager-macos-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true
      - name: Verify both architecture downloads
        working-directory: artifacts
        run: |
          test -f SHA256SUMS-arm64.txt
          test -f SHA256SUMS-x86_64.txt
          sha256sum -c SHA256SUMS-arm64.txt
          sha256sum -c SHA256SUMS-x86_64.txt
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to modify a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "GPT Manager $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          echo "Draft release assembled. Review assets and notes before publishing." >> "$GITHUB_STEP_SUMMARY"
